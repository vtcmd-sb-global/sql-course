<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #1a1a1a; }
      .entity { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .attr { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #1a1a1a; }
      .rel { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1a1a1a; }
      .card { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #c0392b; }
      .note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #555; }
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2.2; }
      .attrbox { fill: #eaf2f8; stroke: #2980b9; stroke-width: 1.4; }
      .diamond { fill: #fef5e7; stroke: #d68910; stroke-width: 2; }
      .line { stroke: #2c3e50; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="980" height="700" fill="#f8fafc"/>
  <text x="490" y="32" text-anchor="middle" class="title">Sample E-R Diagram - College Management System</text>

  <!-- ========== DEPARTMENT (top center) ========== -->
  <rect x="400" y="60" width="160" height="48" rx="4" class="box"/>
  <text x="480" y="90" text-anchor="middle" class="entity">Department</text>

  <ellipse cx="300" cy="50" rx="52" ry="18" class="attrbox"/>
  <text x="300" y="54" text-anchor="middle" class="attr" text-decoration="underline">DeptID</text>
  <line x1="350" y1="58" x2="400" y2="75" class="line"/>

  <ellipse cx="300" cy="95" rx="52" ry="16" class="attrbox"/>
  <text x="300" y="99" text-anchor="middle" class="attr">DeptName</text>
  <line x1="352" y1="95" x2="400" y2="90" class="line"/>

  <ellipse cx="650" cy="70" rx="48" ry="16" class="attrbox"/>
  <text x="650" y="74" text-anchor="middle" class="attr">Location</text>
  <line x1="602" y1="70" x2="560" y2="80" class="line"/>

  <!-- ========== INSTRUCTOR (left) ========== -->
  <rect x="60" y="280" width="140" height="48" rx="4" class="box"/>
  <text x="130" y="310" text-anchor="middle" class="entity">Instructor</text>

  <ellipse cx="40" cy="250" rx="48" ry="16" class="attrbox"/>
  <text x="40" y="254" text-anchor="middle" class="attr" text-decoration="underline">InstrID</text>
  <line x1="80" y1="260" x2="100" y2="285" class="line"/>

  <ellipse cx="35" cy="300" rx="40" ry="15" class="attrbox"/>
  <text x="35" y="304" text-anchor="middle" class="attr">Name</text>
  <line x1="75" y1="300" x2="90" y2="300" class="line"/>

  <ellipse cx="40" cy="340" rx="40" ry="15" class="attrbox"/>
  <text x="40" y="344" text-anchor="middle" class="attr">Email</text>
  <line x1="80" y1="335" x2="100" y2="315" class="line"/>

  <!-- ========== COURSE (right) ========== -->
  <rect x="750" y="280" width="140" height="48" rx="4" class="box"/>
  <text x="820" y="310" text-anchor="middle" class="entity">Course</text>

  <ellipse cx="920" cy="250" rx="50" ry="16" class="attrbox"/>
  <text x="920" y="254" text-anchor="middle" class="attr" text-decoration="underline">CourseID</text>
  <line x1="870" y1="260" x2="860" y2="285" class="line"/>

  <ellipse cx="930" cy="300" rx="40" ry="15" class="attrbox"/>
  <text x="930" y="304" text-anchor="middle" class="attr">Title</text>
  <line x1="890" y1="300" x2="880" y2="300" class="line"/>

  <ellipse cx="920" cy="340" rx="42" ry="15" class="attrbox"/>
  <text x="920" y="344" text-anchor="middle" class="attr">Credits</text>
  <line x1="878" y1="335" x2="860" y2="315" class="line"/>

  <!-- ========== STUDENT (bottom center) ========== -->
  <rect x="400" y="520" width="150" height="48" rx="4" class="box"/>
  <text x="475" y="550" text-anchor="middle" class="entity">Student</text>

  <ellipse cx="300" cy="500" rx="52" ry="16" class="attrbox"/>
  <text x="300" y="504" text-anchor="middle" class="attr" text-decoration="underline">StudentID</text>
  <line x1="350" y1="510" x2="400" y2="535" class="line"/>

  <ellipse cx="290" cy="545" rx="40" ry="15" class="attrbox"/>
  <text x="290" y="549" text-anchor="middle" class="attr">Name</text>
  <line x1="330" y1="545" x2="400" y2="545" class="line"/>

  <ellipse cx="310" cy="590" rx="40" ry="15" class="attrbox"/>
  <text x="310" y="594" text-anchor="middle" class="attr">DOB</text>
  <line x1="345" y1="580" x2="410" y2="560" class="line"/>

  <!-- Multi-valued Phone -->
  <ellipse cx="620" cy="540" rx="48" ry="18" class="attrbox"/>
  <ellipse cx="620" cy="540" rx="40" ry="12" fill="none" stroke="#2980b9" stroke-width="1.4"/>
  <text x="620" y="544" text-anchor="middle" class="attr">Phone</text>
  <line x1="572" y1="540" x2="550" y2="545" class="line"/>
  <text x="620" y="575" text-anchor="middle" class="note">(multi-valued)</text>

  <!-- ========== RELATIONSHIPS ========== -->

  <!-- WorksIn (Department 1 to M Instructor) -->
  <polygon points="200,160 250,135 300,160 250,185" class="diamond"/>
  <text x="250" y="165" text-anchor="middle" class="rel">WorksIn</text>
  <line x1="250" y1="135" x2="420" y2="108" class="line"/>
  <line x1="250" y1="185" x2="140" y2="280" class="line"/>
  <text x="340" y="115" class="card">1</text>
  <text x="175" y="240" class="card">M</text>

  <!-- Offers (Department 1 to M Course) -->
  <polygon points="660,160 710,135 760,160 710,185" class="diamond"/>
  <text x="710" y="165" text-anchor="middle" class="rel">Offers</text>
  <line x1="710" y1="135" x2="540" y2="108" class="line"/>
  <line x1="710" y1="185" x2="810" y2="280" class="line"/>
  <text x="600" y="115" class="card">1</text>
  <text x="770" y="240" class="card">M</text>

  <!-- Teaches (Instructor M to N Course) -->
  <polygon points="420,300 490,270 560,300 490,330" class="diamond"/>
  <text x="490" y="305" text-anchor="middle" class="rel">Teaches</text>
  <line x1="420" y1="300" x2="200" y2="300" class="line"/>
  <line x1="560" y1="300" x2="750" y2="300" class="line"/>
  <text x="300" y="290" class="card">M</text>
  <text x="660" y="290" class="card">N</text>

  <!-- Enrolls (Student M to N Course) -->
  <polygon points="560,420 630,390 700,420 630,450" class="diamond"/>
  <text x="630" y="425" text-anchor="middle" class="rel">Enrolls</text>
  <line x1="560" y1="420" x2="500" y2="520" class="line"/>
  <line x1="700" y1="420" x2="800" y2="328" class="line"/>
  <text x="520" y="480" class="card">M</text>
  <text x="760" y="380" class="card">N</text>

  <!-- Relationship attributes on Enrolls -->
  <ellipse cx="730" cy="470" rx="42" ry="15" class="attrbox"/>
  <text x="730" y="474" text-anchor="middle" class="attr">Grade</text>
  <line x1="700" y1="460" x2="660" y2="440" class="line"/>

  <ellipse cx="790" cy="505" rx="55" ry="15" class="attrbox"/>
  <text x="790" y="509" text-anchor="middle" class="attr">EnrollDate</text>
  <line x1="750" y1="495" x2="680" y2="445" class="line"/>

  <!-- Legend -->
  <rect x="30" y="600" width="300" height="80" rx="6" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.3"/>
  <text x="45" y="622" class="entity" font-size="13">Legend</text>
  <text x="45" y="642" class="note">- Underlined = Primary Key</text>
  <text x="45" y="658" class="note">- Double oval = Multi-valued attribute</text>
  <text x="45" y="674" class="note">- Diamonds = Relationships (with cardinality)</text>

  <text x="490" y="690" text-anchor="middle" class="note">Note: M:N relationships (Teaches, Enrolls) will be resolved into junction tables in the relational schema</text>
</svg>