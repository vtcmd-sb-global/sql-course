<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .section { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #2c3e50; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #1a1a1a; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #555; }
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .attr { fill: #e8f4fd; stroke: #2980b9; stroke-width: 1.6; }
      .rel { fill: #fef9e7; stroke: #d68910; stroke-width: 2; }
      .line { stroke: #2c3e50; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="920" height="780" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" class="title">Entity-Relationship Diagram Symbols</text>

  <!-- 1. ENTITIES -->
  <text x="40" y="75" class="section">1. Entities</text>

  <rect x="40" y="95" width="130" height="42" rx="4" class="box"/>
  <text x="105" y="121" text-anchor="middle" class="label">Student</text>
  <text x="185" y="112" class="sub">Strong Entity</text>
  <text x="185" y="128" class="sub">(single rectangle)</text>

  <rect x="40" y="160" width="130" height="42" rx="4" class="box"/>
  <rect x="46" y="166" width="118" height="30" rx="2" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="105" y="186" text-anchor="middle" class="label">Dependent</text>
  <text x="185" y="177" class="sub">Weak Entity</text>
  <text x="185" y="193" class="sub">(double rectangle)</text>

  <!-- 2. ATTRIBUTES -->
  <text x="40" y="250" class="section">2. Attributes</text>

  <!-- Simple -->
  <ellipse cx="105" cy="295" rx="60" ry="24" class="attr"/>
  <text x="105" y="300" text-anchor="middle" class="label">Age</text>
  <text x="185" y="290" class="sub">Simple / Single-valued</text>
  <text x="185" y="306" class="sub">(oval)</text>

  <!-- Key -->
  <ellipse cx="105" cy="360" rx="60" ry="24" class="attr"/>
  <text x="105" y="365" text-anchor="middle" class="label" text-decoration="underline">StudentID</text>
  <text x="185" y="355" class="sub">Key Attribute (PK)</text>
  <text x="185" y="371" class="sub">(underlined)</text>

  <!-- Multi-valued -->
  <ellipse cx="105" cy="425" rx="60" ry="24" class="attr"/>
  <ellipse cx="105" cy="425" rx="52" ry="17" fill="none" stroke="#2980b9" stroke-width="1.5"/>
  <text x="105" y="430" text-anchor="middle" class="label">Phone</text>
  <text x="185" y="420" class="sub">Multi-valued Attribute</text>
  <text x="185" y="436" class="sub">(double oval)</text>

  <!-- Derived -->
  <ellipse cx="105" cy="490" rx="60" ry="24" fill="#e8f4fd" stroke="#2980b9" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="105" y="495" text-anchor="middle" class="label">Age</text>
  <text x="185" y="485" class="sub">Derived Attribute</text>
  <text x="185" y="501" class="sub">(dashed oval)</text>

  <!-- Composite -->
  <ellipse cx="105" cy="560" rx="60" ry="24" class="attr"/>
  <text x="105" y="565" text-anchor="middle" class="label">Name</text>
  <line x1="105" y1="584" x2="60" y2="620" class="line"/>
  <line x1="105" y1="584" x2="150" y2="620" class="line"/>
  <ellipse cx="60" cy="645" rx="40" ry="18" class="attr"/>
  <text x="60" y="650" text-anchor="middle" class="label">First</text>
  <ellipse cx="150" cy="645" rx="40" ry="18" class="attr"/>
  <text x="150" y="650" text-anchor="middle" class="label">Last</text>
  <text x="210" y="555" class="sub">Composite Attribute</text>
  <text x="210" y="571" class="sub">(oval with sub-ovals)</text>

  <!-- 3. RELATIONSHIPS -->
  <text x="480" y="75" class="section">3. Relationships</text>

  <polygon points="520,110 580,85 640,110 580,135" class="rel"/>
  <text x="580" y="115" text-anchor="middle" class="label">Enrolls</text>
  <text x="670" y="105" class="sub">Relationship</text>
  <text x="670" y="121" class="sub">(diamond)</text>

  <polygon points="520,175 580,150 640,175 580,200" class="rel"/>
  <polygon points="530,175 580,158 630,175 580,192" fill="none" stroke="#d68910" stroke-width="1.5"/>
  <text x="580" y="180" text-anchor="middle" class="label">Has</text>
  <text x="670" y="170" class="sub">Identifying Rel.</text>
  <text x="670" y="186" class="sub">(double diamond)</text>

  <!-- 4. CARDINALITY -->
  <text x="480" y="250" class="section">4. Cardinality and Participation</text>

  <!-- 1:1 -->
  <rect x="480" y="275" width="80" height="34" rx="3" class="box"/>
  <text x="520" y="297" text-anchor="middle" class="label">Person</text>
  <line x1="560" y1="292" x2="600" y2="292" class="line"/>
  <text x="580" y="285" text-anchor="middle" class="sub">1</text>
  <polygon points="600,292 625,275 650,292 625,309" class="rel"/>
  <text x="625" y="297" text-anchor="middle" class="label">Has</text>
  <line x1="650" y1="292" x2="690" y2="292" class="line"/>
  <text x="670" y="285" text-anchor="middle" class="sub">1</text>
  <rect x="690" y="275" width="80" height="34" rx="3" class="box"/>
  <text x="730" y="297" text-anchor="middle" class="label">Passport</text>
  <text x="620" y="330" text-anchor="middle" class="sub">One-to-One (1:1)</text>

  <!-- 1:M -->
  <rect x="470" y="360" width="100" height="34" rx="3" class="box"/>
  <text x="520" y="382" text-anchor="middle" class="label">Department</text>
  <line x1="570" y1="377" x2="600" y2="377" class="line"/>
  <text x="585" y="370" text-anchor="middle" class="sub">1</text>
  <polygon points="600,377 625,360 650,377 625,394" class="rel"/>
  <text x="625" y="382" text-anchor="middle" class="label">Has</text>
  <line x1="650" y1="377" x2="690" y2="377" class="line"/>
  <text x="670" y="370" text-anchor="middle" class="sub">M</text>
  <rect x="690" y="360" width="90" height="34" rx="3" class="box"/>
  <text x="735" y="382" text-anchor="middle" class="label">Employee</text>
  <text x="620" y="415" text-anchor="middle" class="sub">One-to-Many (1:M)</text>

  <!-- M:N -->
  <rect x="480" y="445" width="80" height="34" rx="3" class="box"/>
  <text x="520" y="467" text-anchor="middle" class="label">Student</text>
  <line x1="560" y1="462" x2="600" y2="462" class="line"/>
  <text x="580" y="455" text-anchor="middle" class="sub">M</text>
  <polygon points="600,462 625,445 650,462 625,479" class="rel"/>
  <text x="625" y="467" text-anchor="middle" class="label">Takes</text>
  <line x1="650" y1="462" x2="690" y2="462" class="line"/>
  <text x="670" y="455" text-anchor="middle" class="sub">N</text>
  <rect x="690" y="445" width="80" height="34" rx="3" class="box"/>
  <text x="730" y="467" text-anchor="middle" class="label">Course</text>
  <text x="620" y="500" text-anchor="middle" class="sub">Many-to-Many (M:N)</text>

  <!-- 5. PARTICIPATION -->
  <text x="480" y="545" class="section">5. Participation</text>

  <line x1="500" y1="580" x2="580" y2="580" class="line" stroke-width="3.5"/>
  <text x="540" y="605" text-anchor="middle" class="sub">Total (mandatory)</text>
  <text x="540" y="621" text-anchor="middle" class="sub">double line</text>

  <line x1="650" y1="580" x2="730" y2="580" class="line"/>
  <text x="690" y="605" text-anchor="middle" class="sub">Partial (optional)</text>
  <text x="690" y="621" text-anchor="middle" class="sub">single line</text>

  <text x="460" y="750" text-anchor="middle" class="sub">Chen Notation - Common symbols used in academic and professional ER diagrams</text>
</svg>