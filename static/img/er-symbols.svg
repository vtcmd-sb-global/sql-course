<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #333; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #555; }
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .weak { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .attr { fill: #e8f4fd; stroke: #2980b9; stroke-width: 1.5; }
      .rel { fill: #fef9e7; stroke: #d68910; stroke-width: 2; }
      .line { stroke: #2c3e50; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" class="title">Entity-Relationship Diagram Symbols</text>

  <!-- ========== ENTITIES ========== -->
  <text x="40" y="85" class="label" font-weight="600">1. Entities</text>

  <!-- Strong Entity -->
  <rect x="40" y="100" width="140" height="50" rx="4" class="box"/>
  <text x="110" y="130" text-anchor="middle" class="label">Student</text>
  <text x="190" y="120" class="sub">Strong Entity</text>
  <text x="190" y="138" class="sub">(single rectangle)</text>

  <!-- Weak Entity -->
  <rect x="40" y="170" width="140" height="50" rx="4" class="box"/>
  <rect x="46" y="176" width="128" height="38" rx="2" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="110" y="200" text-anchor="middle" class="label">Dependent</text>
  <text x="190" y="190" class="sub">Weak Entity</text>
  <text x="190" y="208" class="sub">(double rectangle)</text>

  <!-- ========== ATTRIBUTES ========== -->
  <text x="40" y="265" class="label" font-weight="600">2. Attributes</text>

  <!-- Simple Attribute -->
  <ellipse cx="110" cy="310" rx="70" ry="28" class="attr"/>
  <text x="110" y="315" text-anchor="middle" class="label">Age</text>
  <text x="200" y="305" class="sub">Simple / Single-valued</text>
  <text x="200" y="323" class="sub">(oval)</text>

  <!-- Key Attribute -->
  <ellipse cx="110" cy="375" rx="70" ry="28" class="attr"/>
  <text x="110" y="380" text-anchor="middle" class="label" text-decoration="underline">StudentID</text>
  <text x="200" y="370" class="sub">Key Attribute (PK)</text>
  <text x="200" y="388" class="sub">(underlined)</text>

  <!-- Multi-valued -->
  <ellipse cx="110" cy="440" rx="70" ry="28" class="attr"/>
  <ellipse cx="110" cy="440" rx="62" ry="20" fill="none" stroke="#2980b9" stroke-width="1.5"/>
  <text x="110" y="445" text-anchor="middle" class="label">Phone</text>
  <text x="200" y="435" class="sub">Multi-valued Attribute</text>
  <text x="200" y="453" class="sub">(double oval)</text>

  <!-- Derived -->
  <ellipse cx="110" cy="505" rx="70" ry="28" fill="#e8f4fd" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="110" y="510" text-anchor="middle" class="label">Age</text>
  <text x="200" y="500" class="sub">Derived Attribute</text>
  <text x="200" y="518" class="sub">(dashed oval)</text>

  <!-- Composite -->
  <ellipse cx="110" cy="580" rx="70" ry="28" class="attr"/>
  <text x="110" y="585" text-anchor="middle" class="label">Name</text>
  <line x1="110" y1="608" x2="70" y2="640" class="line"/>
  <line x1="110" y1="608" x2="150" y2="640" class="line"/>
  <ellipse cx="70" cy="660" rx="45" ry="20" class="attr"/>
  <text x="70" y="665" text-anchor="middle" class="label" font-size="12">First</text>
  <ellipse cx="150" cy="660" rx="45" ry="20" class="attr"/>
  <text x="150" y="665" text-anchor="middle" class="label" font-size="12">Last</text>
  <text x="220" y="580" class="sub">Composite Attribute</text>
  <text x="220" y="598" class="sub">(oval with sub-ovals)</text>

  <!-- ========== RELATIONSHIPS ========== -->
  <text x="480" y="85" class="label" font-weight="600">3. Relationships</text>

  <!-- Regular Relationship -->
  <polygon points="550,130 620,100 690,130 620,160" class="rel"/>
  <text x="620" y="135" text-anchor="middle" class="label">Enrolls</text>
  <text x="720" y="120" class="sub">Relationship</text>
  <text x="720" y="138" class="sub">(diamond)</text>

  <!-- Identifying Relationship -->
  <polygon points="550,200 620,170 690,200 620,230" class="rel"/>
  <polygon points="560,200 620,180 680,200 620,220" fill="none" stroke="#d68910" stroke-width="1.5"/>
  <text x="620" y="205" text-anchor="middle" class="label">Has</text>
  <text x="720" y="190" class="sub">Identifying Rel.</text>
  <text x="720" y="208" class="sub">(double diamond)</text>

  <!-- ========== CARDINALITY ========== -->
  <text x="480" y="280" class="label" font-weight="600">4. Cardinality &amp;amp; Participation</text>

  <!-- 1:1 -->
  <rect x="480" y="300" width="80" height="36" rx="3" class="box"/>
  <text x="520" y="323" text-anchor="middle" class="label" font-size="13">Person</text>
  <line x1="560" y1="318" x2="620" y2="318" class="line"/>
  <text x="590" y="310" text-anchor="middle" class="sub">1</text>
  <polygon points="620,318 650,300 680,318 650,336" class="rel"/>
  <text x="650" y="323" text-anchor="middle" class="label" font-size="12">Has</text>
  <line x1="680" y1="318" x2="740" y2="318" class="line"/>
  <text x="710" y="310" text-anchor="middle" class="sub">1</text>
  <rect x="740" y="300" width="80" height="36" rx="3" class="box"/>
  <text x="780" y="323" text-anchor="middle" class="label" font-size="13">Passport</text>
  <text x="620" y="360" text-anchor="middle" class="sub">One-to-One (1:1)</text>

  <!-- 1:M -->
  <rect x="480" y="390" width="90" height="36" rx="3" class="box"/>
  <text x="525" y="413" text-anchor="middle" class="label" font-size="13">Department</text>
  <line x1="570" y1="408" x2="620" y2="408" class="line"/>
  <text x="595" y="400" text-anchor="middle" class="sub">1</text>
  <polygon points="620,408 650,390 680,408 650,426" class="rel"/>
  <text x="650" y="413" text-anchor="middle" class="label" font-size="12">Has</text>
  <line x1="680" y1="408" x2="740" y2="408" class="line"/>
  <text x="710" y="400" text-anchor="middle" class="sub">M</text>
  <rect x="740" y="390" width="90" height="36" rx="3" class="box"/>
  <text x="785" y="413" text-anchor="middle" class="label" font-size="13">Employee</text>
  <text x="620" y="450" text-anchor="middle" class="sub">One-to-Many (1:M)</text>

  <!-- M:N -->
  <rect x="480" y="480" width="80" height="36" rx="3" class="box"/>
  <text x="520" y="503" text-anchor="middle" class="label" font-size="13">Student</text>
  <line x1="560" y1="498" x2="620" y2="498" class="line"/>
  <text x="590" y="490" text-anchor="middle" class="sub">M</text>
  <polygon points="620,498 650,480 680,498 650,516" class="rel"/>
  <text x="650" y="503" text-anchor="middle" class="label" font-size="12">Takes</text>
  <line x1="680" y1="498" x2="740" y2="498" class="line"/>
  <text x="710" y="490" text-anchor="middle" class="sub">N</text>
  <rect x="740" y="480" width="80" height="36" rx="3" class="box"/>
  <text x="780" y="503" text-anchor="middle" class="label" font-size="13">Course</text>
  <text x="620" y="540" text-anchor="middle" class="sub">Many-to-Many (M:N)</text>

  <!-- Participation -->
  <text x="480" y="580" class="label" font-weight="600">5. Participation</text>
  <line x1="500" y1="610" x2="580" y2="610" class="line" stroke-width="3"/>
  <text x="540" y="635" text-anchor="middle" class="sub">Total (mandatory)</text>
  <text x="540" y="650" text-anchor="middle" class="sub">double line</text>

  <line x1="650" y1="610" x2="730" y2="610" class="line"/>
  <text x="690" y="635" text-anchor="middle" class="sub">Partial (optional)</text>
  <text x="690" y="650" text-anchor="middle" class="sub">single line</text>

  <!-- Footer -->
  <text x="450" y="700" text-anchor="middle" class="sub">Chen Notation • Common symbols used in academic &amp;amp; professional ER diagrams</text>
</svg>